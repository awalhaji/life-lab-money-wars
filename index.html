<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE LAB — Online Money Wars</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#eef4ff;background:#080f24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#233e76,#080f24 70%);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:18px}h1{font-size:clamp(27px,5vw,48px);margin:8px 0 3px}h1 span{color:#ffcd4c}.sub{color:#bbcdf1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.panel{background:#151f40;border:1px solid #3b558c;border-radius:18px;padding:15px}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;gap:3px;background:#263a65;border:6px solid #3d5b99;border-radius:14px;overflow:hidden}.tile{background:#e6ebf7;color:#142244;font-size:clamp(7px,1vw,12px);padding:3px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-width:0;overflow:hidden}.tile.special{background:#fff0c7}.tile .bar{height:7px;width:110%;margin:-3px -3px 1px}.tile .name{font-weight:800;overflow-wrap:anywhere}.tile small{font-size:10px}.tokens{font-size:clamp(11px,1.8vw,21px)}.center{grid-column:2/8;grid-row:2/8;background:radial-gradient(circle,#35518b,#111a35);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:12px}.center strong{color:#ffcd4c;font-size:clamp(20px,4vw,48px)}button{border:0;border-radius:11px;padding:11px 14px;background:#ffcb4e;color:#122041;font-weight:800;cursor:pointer;font-size:15px}button:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#38558d;color:white}.danger{background:#eb7185;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#314b82;border-radius:20px;padding:5px 10px;font-size:12px}.player{background:#24365f;border:2px solid transparent;border-radius:10px;padding:9px;margin:7px 0}.player.active{border-color:#ffce55}.player.out{opacity:.45}.cash{color:#83efba;font-weight:800}.log{height:160px;overflow:auto;background:#0b1530;padding:10px;border-radius:10px;font-size:13px}.log div{margin-bottom:7px}.dice{font-size:56px}.modal{position:fixed;inset:0;background:#000b;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal[hidden]{display:none}.dialog{width:min(480px,100%);background:#1b2c54;border:2px solid #7899d5;border-radius:20px;padding:22px;text-align:center;max-height:90vh;overflow:auto}.dialog h2{color:#ffcf57}.dialog p{line-height:1.5}.dialog input{width:100%;background:#0b1733;color:white;border:1px solid #7a98ce;border-radius:10px;padding:12px;margin:8px 0;font-size:16px}.muted{color:#afc4ed;font-size:13px}.error{color:#ffb6bc}.status{color:#bbcff8}.footer{text-align:center;color:#a8bce7;font-size:12px;margin:18px}.waiting{color:#ffd15a}@media(max-width:850px){.layout{grid-template-columns:1fr}.tile{font-size:clamp(6px,1.5vw,11px)}.panel{padding:9px}}
</style></head><body><main class="wrap"><h1>⚔️ LIFE LAB <span>MONEY WARS</span></h1><p class="sub">Online multiplayer • Build an empire • Learn money by playing</p><div class="layout"><section class="panel"><div class="board" id="board"></div></section><aside class="panel"><div class="row"><h2>🎲 Your Battle</h2><span id="round" class="pill">Round 1</span></div><p id="room" class="status">Not connected</p><h3 id="turn">Create or join a room</h3><div class="dice" id="dice">⚀ ⚄</div><div class="actions"><button id="roll" disabled>Roll Dice</button><button id="end" class="secondary" disabled>End Turn</button></div><p id="status" class="muted">Waiting for a game</p><h3>🏆 Players</h3><div id="players"></div><h3>📣 Game Feed</h3><div class="log" id="log"></div><div class="actions"><button class="secondary" id="rules">Rules</button><button class="secondary" id="leave">Leave Room</button></div></aside></div><p class="footer">LIFE LAB competition edition • 2–4 online players • No player accounts required</p></main><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script src="firebase-config.js"></script>
<script>
let initializeApp,getDatabase,ref,onValue,runTransaction;
const $=id=>document.getElementById(id),fmt=n=>'$'+Math.max(0,n).toLocaleString(),icons=['🚀','🦊','🐲','🚗'],groups=['#ff7676','#65baff','#ad8eff','#ffb24e','#65d4a5','#f38cce'];
const names=['Pixel Plaza','Creator Corner','Podcast Park','Cloud Avenue','Data District','App Arcade','Market Mile','Startup Street','Innovation Inn','Solar Square','Green Gardens','Wind Way','Finance Forum','Savings Street','Bank Boulevard','Robot Road','AI Alley','Future Factory'];
const blueprint=[{type:'start',name:'🚀 Launch Pad'},...names.slice(0,3).map((name,i)=>({type:'property',name,group:0,price:100+i*20})),{type:'event',name:'🎁 Life Event'},...names.slice(3,6).map((name,i)=>({type:'property',name,group:1,price:150+i*20})),{type:'tax',name:'💸 Tax Day',amount:100},...names.slice(6,9).map((name,i)=>({type:'property',name,group:2,price:200+i*20})),{type:'payday',name:'💰 Gig Payday'},...names.slice(9,12).map((name,i)=>({type:'property',name,group:3,price:250+i*20})),{type:'timeout',name:'🚨 Time-out'},...names.slice(12,15).map((name,i)=>({type:'property',name,group:4,price:300+i*20})),{type:'event',name:'🎲 Life Event'},...names.slice(15,18).map((name,i)=>({type:'property',name,group:5,price:350+i*20})),{type:'tax',name:'🏛️ City Tax',amount:150},{type:'payday',name:'💵 Side Hustle'},{type:'rest',name:'🌴 Free Rest'},{type:'event',name:'🎁 Bonus Event'}];
if(blueprint.length!==28)throw Error('Expected 28 squares');
const events=[['🎉 Viral Success!','Your project takes off.',250],['🔧 Emergency Repair','Unexpected costs happen.',-180],['📈 Smart Investment','Your investment grew.',200],['💻 Freelance Gig','You earned extra income.',150],['📉 Market Dip','Your portfolio lost value.',-120],['🎓 Scholarship!','Education creates opportunity.',180],['🚑 Medical Bill','An emergency fund can help.',-150],['💸 Subscription Audit','You canceled unused subscriptions.',100]];
let db,roomCode='',myId='',room=null,unsubscribe=null,modalMode='welcome',errorMessage='';const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ';const randomCode=()=>Array.from({length:4},()=>alphabet[Math.floor(Math.random()*alphabet.length)]).join('');const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const log=(s,r)=>{r.feed=[s,...(r.feed||[])].slice(0,35)};const show=html=>{$('dialog').innerHTML=html;$('modal').hidden=false};const hide=()=>{$('modal').hidden=true};const initialPlayer=(id,name)=>({id,name:name.slice(0,18)||'Player',cash:1500,pos:0,out:false,skip:false});const tile=(i)=>blueprint[i];const myIndex=r=>(r.players||[]).findIndex(p=>p.id===myId);const alive=r=>r.players.filter(p=>!p.out);const rent=(r,i)=>{const t=tile(i),prop=r.properties?.[i];if(!prop)return 0;const full=blueprint.every((x,j)=>x.type!=='property'||x.group!==t.group||r.properties?.[j]?.owner===prop.owner);return Math.round(t.price*.2)*(full?2:1)*(1+2*(prop.level||0))};
function render(){const r=room;const b=$('board');b.innerHTML='';blueprint.forEach((t,i)=>{let row,col;if(i<8){row=8;col=8-i}else if(i<14){row=8-(i-7);col=1}else if(i<22){row=1;col=i-13}else{row=i-20;col=8}const e=document.createElement('div');e.className='tile '+(t.type==='property'?'':'special');e.style.gridRow=row;e.style.gridColumn=col;const prop=r?.properties?.[i];e.innerHTML=(t.type==='property'?`<div class="bar" style="background:${groups[t.group]}"></div>`:'')+`<div class="name">${safe(t.name)}</div>`+(t.type==='property'?`<small>${fmt(t.price)} ${'🏠'.repeat(Math.min(prop?.level||0,1))}${prop?.level===2?'🏨':''}</small>`:'')+(prop?`<small>🏷️ ${safe(r.players[prop.owner]?.name||'')}</small>`:'')+`<div class="tokens">${(r?.players||[]).filter(p=>!p.out&&p.pos===i).map(p=>icons[r.players.indexOf(p)]).join('')}</div>`;b.append(e)});const center=document.createElement('div');center.className='center';center.innerHTML='<div style="font-size:64px">💎</div><strong>MONEY WARS</strong><p>Build smart. Play bold.</p>';b.append(center);$('room').textContent=roomCode?'Room code: '+roomCode:'Not connected';$('round').textContent='Round '+(r?.round||1);$('players').innerHTML=(r?.players||[]).map((p,i)=>`<div class="player ${r.turn===i?'active':''} ${p.out?'out':''}"><div class="row"><b>${icons[i]} ${safe(p.name)} ${p.id===myId?'(you)':''}${p.out?' (OUT)':''}</b><span class="cash">${fmt(p.cash)}</span></div><small>${Object.values(r.properties||{}).filter(v=>v.owner===i).length} properties${p.skip?' · ⏳ Time-out':''}</small></div>`).join('');$('log').innerHTML=(r?.feed||[]).map(s=>`<div>${safe(s)}</div>`).join('');const mine=r&&myIndex(r)===r.turn;const p=r?.players?.[r?.turn];$('turn').textContent=!r?'Create or join a room':r.status==='lobby'?'Waiting for players':r.status==='finished'?`${r.players[r.winner]?.name||'Player'} wins!`:`${icons[r.turn]} ${p?.name}'s turn${mine?' (YOU)':''}`;$('roll').disabled=!(r?.status==='playing'&&mine&&r.phase==='roll');$('end').disabled=!(r?.status==='playing'&&mine&&r.phase==='end');$('status').textContent=!r?'Create or join a room':r.status==='lobby'?'Host starts when 2–4 players join.':r.status==='finished'?'🏆 Game over!':mine?(r.phase==='roll'?'Your turn: roll the dice.':r.phase==='decision'?'Choose an action in the popup.':'Click End Turn.'):'Waiting for the active player.';$('dice').textContent=r?.dice?('⚀⚁⚂⚃⚄⚅'[r.dice[0]-1]+' '+'⚀⚁⚂⚃⚄⚅'[r.dice[1]-1]):'⚀ ⚄'}
function welcome(msg=''){modalMode='welcome';show(`<h2>⚔️ LIFE LAB Online</h2><p>Play with friends on different computers.</p>${msg?`<p class="error">${safe(msg)}</p>`:''}<input id="nickname" maxlength="18" placeholder="Your player name" aria-label="Player name"><button id="create">Create Room</button> <button id="join">Join Room</button><p class="muted">Players don't need accounts. The host shares a four-letter room code.</p>`);$('create').onclick=()=>connect('create');$('join').onclick=()=>{const name=$('nickname').value.trim();if(!name)return welcome('Enter your name first.');modalMode='join';show(`<h2>Join a Room</h2><input id="code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" aria-label="Room code"><button id="joinNow">Join Game</button> <button class="secondary" id="back">Back</button>`);$('joinNow').onclick=()=>connect('join',name);$('back').onclick=()=>welcome()}}
async function connect(mode,existingName){const name=(existingName||$('nickname')?.value||'').trim();if(!name){welcome('Enter your name first.');return}try{if(mode==='create'){let code,found;for(let i=0;i<12;i++){code=randomCode();const r=ref(db,'rooms/'+code);const result=await runTransaction(r,v=>v===null?{status:'lobby',host:myId,players:[initialPlayer(myId,name)],turn:0,round:1,phase:'roll',properties:{},feed:['🎮 Room created. Invite friends!'],createdAt:Date.now(),updatedAt:Date.now()}:undefined,{applyLocally:false});if(result.committed){found=code;break}}if(!found)throw Error('Could not find an unused room code. Try again.');roomCode=found}else{const code=$('code').value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(code))throw Error('Enter the four-letter code.');const result=await runTransaction(ref(db,'rooms/'+code),r=>{if(!r||r.status!=='lobby'||r.players.length>=4||r.players.some(p=>p.id===myId))return; r.players.push(initialPlayer(myId,name));r.updatedAt=Date.now();log('👋 '+name+' joined the room.',r);return r},{applyLocally:false});if(!result.committed)throw Error('Room not found, full, or already started.');roomCode=code}sessionStorage.setItem('life-lab-session',JSON.stringify({roomCode,myId}));subscribe();hide()}catch(e){welcome(e.message||'Could not connect. Check Firebase setup and your internet connection.')}}
function subscribe(){if(unsubscribe)unsubscribe();unsubscribe=onValue(ref(db,'rooms/'+roomCode),snap=>{room=snap.val();if(!room){sessionStorage.removeItem('life-lab-session');roomCode='';render();welcome('Room no longer exists.');return}render();if(room.status==='lobby'){lobby()}else if(room.status==='playing'&&myIndex(room)===room.turn&&room.phase==='decision'){decisionPopup()}else if(room.status==='finished'){finishPopup()}else hide()},e=>welcome('Database access failed: '+e.message))}
function lobby(){modalMode='lobby';const host=room.host===myId;show(`<h2>🎮 Room ${safe(roomCode)}</h2><p>Share this code with friends:</p><h1 style="letter-spacing:7px;color:#ffcf57">${safe(roomCode)}</h1><p>${room.players.map((p,i)=>icons[i]+' '+safe(p.name)).join('<br>')}</p><p class="muted">${room.players.length}/4 players connected. Minimum 2.</p>${host?'<button id="start" '+(room.players.length<2?'disabled':'')+'>Start Battle 🚀</button>':'<p class="waiting">Waiting for the host to start…</p>'}<p><button class="secondary" id="copyCode">Copy Code</button></p>`);$('copyCode').onclick=()=>navigator.clipboard?.writeText(roomCode);if(host)$('start').onclick=()=>mutate(r=>{if(r.status!=='lobby'||r.host!==myId||r.players.length<2)return false;r.status='playing';r.phase='roll';r.turn=0;r.round=1;log('🚀 Battle started! Everyone has $1,500.',r);return true})}
async function mutate(change){if(!roomCode)return;try{const result=await runTransaction(ref(db,'rooms/'+roomCode),r=>{if(!r)return;const ok=change(r);if(ok===false)return;r.updatedAt=Date.now();return r},{applyLocally:false});if(!result.committed)console.info('Action not committed (state changed).')}catch(e){alert('Action failed: '+e.message)}}
function take(r,p,amount,recipient){const paid=Math.min(p.cash,amount);p.cash-=amount;if(recipient)recipient.cash+=paid;if(p.cash<=0){p.out=true;Object.keys(r.properties||{}).forEach(k=>{if(r.properties[k].owner===r.players.indexOf(p))delete r.properties[k]});log('💥 '+p.name+' went bankrupt. Their properties are available again.',r)}}
function land(r){const p=r.players[r.turn],t=tile(p.pos),i=p.pos,prop=r.properties?.[i];if(t.type==='property'){if(!prop&&p.cash>=t.price){r.phase='decision';r.pending='buy';return}if(prop&&prop.owner!==r.turn){const fee=rent(r,i);take(r,p,fee,r.players[prop.owner]);log('🏠 '+p.name+' paid '+fmt(fee)+' rent to '+r.players[prop.owner].name,r)}else if(prop&&prop.owner===r.turn&&prop.level<2&&p.cash>=Math.round(t.price*.5)){r.phase='decision';r.pending='build';return}}else if(t.type==='tax'){take(r,p,t.amount);log('💸 '+p.name+' paid '+fmt(t.amount)+' in taxes.',r)}else if(t.type==='payday'){p.cash+=50;log('💰 '+p.name+' earned $50.',r)}else if(t.type==='timeout'){p.skip=true;log('⏳ '+p.name+' must skip their next turn.',r)}else if(t.type==='event'){const e=events[Math.floor(Math.random()*events.length)];if(e[2]<0)take(r,p,-e[2]);else p.cash+=e[2];r.event=e;log(e[0]+' '+p.name+' '+(e[2]>=0?'gained ':'lost ')+fmt(Math.abs(e[2])),r);r.phase='decision';r.pending='event';return}else{log('🌴 '+p.name+' landed on '+t.name,r)}r.phase='end';checkWinner(r)}
function checkWinner(r){if(alive(r).length===1){r.status='finished';r.winner=r.players.findIndex(p=>!p.out);log('🏆 '+r.players[r.winner].name+' wins the Money War!',r)}}
$('roll').onclick=async()=>{const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);$('roll').disabled=true;await mutate(r=>{if(r.status!=='playing'||r.phase!=='roll'||r.players[r.turn]?.id!==myId)return false;const p=r.players[r.turn];r.dice=[a,b];const old=p.pos;p.pos=(p.pos+a+b)%28;if(old+a+b>=28){p.cash+=200;log('🚀 '+p.name+' passed Launch Pad and collected $200!',r)}log('🎲 '+p.name+' rolled '+a+' + '+b+' = '+(a+b),r);land(r);return true})};
function decisionPopup(){const p=room.players[room.turn],t=tile(p.pos),prop=room.properties?.[p.pos];if(room.pending==='buy'){show(`<h2>🏙️ ${safe(t.name)}</h2><p>Buy for ${fmt(t.price)}? Owning the whole color group doubles rent.</p><button id="yes">Buy Property</button> <button class="secondary" id="no">Pass</button>`);$('yes').onclick=()=>act('buy');$('no').onclick=()=>act('pass')}else if(room.pending==='build'){const cost=Math.round(t.price*.5);show(`<h2>🏗️ Upgrade ${safe(t.name)}</h2><p>Build ${prop.level===0?'a house':'a hotel'} for ${fmt(cost)} to increase rent.</p><button id="yes">Build ${fmt(cost)}</button> <button class="secondary" id="no">Skip</button>`);$('yes').onclick=()=>act('build');$('no').onclick=()=>act('pass')}else if(room.pending==='event'){const e=room.event||events[0];show(`<h2>${safe(e[0])}</h2><p>${safe(e[1])}</p><h2>${e[2]>=0?'+':'−'}${fmt(Math.abs(e[2]))}</h2><p class="muted">💡 Plan for risk and build different income sources.</p><button id="ok">Continue</button>`);$('ok').onclick=()=>act('continue')}}
async function act(action){hide();await mutate(r=>{if(r.status!=='playing'||r.phase!=='decision'||r.players[r.turn]?.id!==myId)return false;const p=r.players[r.turn],i=p.pos,t=tile(i),prop=r.properties?.[i];if(r.pending==='buy'){if(action==='buy'&&!prop&&p.cash>=t.price){p.cash-=t.price;r.properties[i]={owner:r.turn,level:0};log('🏙️ '+p.name+' bought '+t.name+' for '+fmt(t.price),r)}else log(p.name+' passed on '+t.name,r)}else if(r.pending==='build'){const cost=Math.round(t.price*.5);if(action==='build'&&prop?.owner===r.turn&&prop.level<2&&p.cash>=cost){p.cash-=cost;prop.level++;log('🏗️ '+p.name+' upgraded '+t.name,r)}}r.phase='end';delete r.pending;delete r.event;checkWinner(r);return true})};
$('end').onclick=()=>mutate(r=>{if(r.status!=='playing'||r.phase!=='end'||r.players[r.turn]?.id!==myId)return false;let n=r.turn,loops=0;do{n=(n+1)%r.players.length;if(n===0)r.round++;loops++;if(!r.players[n].out&&r.players[n].skip){r.players[n].skip=false;log('⏳ '+r.players[n].name+' skipped their turn.',r);continue}if(!r.players[n].out)break}while(loops<r.players.length*3);r.turn=n;r.phase='roll';return true});
function finishPopup(){show(`<h2>🏆 ${safe(room.players[room.winner]?.name||'Winner')} Wins!</h2><p>Last player standing! Great money management.</p><p class="muted">Create a new room to play again.</p><button id="exit">Leave Game</button>`);$('exit').onclick=leave}
function leave(){if(unsubscribe)unsubscribe();unsubscribe=null;sessionStorage.removeItem('life-lab-session');room=null;roomCode='';render();welcome()}
$('leave').onclick=leave;$('rules').onclick=()=>{show('<h2>📜 Rules</h2><p>Each player begins with $1,500. Roll two dice, buy properties, collect rent, and upgrade properties. Owning a complete color set doubles rent. Passing Launch Pad earns $200. Taxes cost money, gigs pay $50, events surprise you, and Time-out skips your next turn. If you run out of cash, you are bankrupt. The last player standing wins!</p><button id="backRules">Back to Game</button>');$('backRules').onclick=()=>{hide();if(room?.status==='lobby')lobby();else if(room?.phase==='decision'&&myIndex(room)===room.turn)decisionPopup();else if(room?.status==='finished')finishPopup()}};
async function boot(){try{render();if(location.protocol==='file:')throw Error('Online play requires a hosted website. Open offline-game.html to play now, or publish these files on GitHub Pages and set up Firebase.');if(!window.firebaseConfig?.apiKey||firebaseConfig.apiKey.includes('PASTE_')||!firebaseConfig.databaseURL||firebaseConfig.databaseURL.includes('PASTE_'))throw Error('Firebase is not configured yet. Follow README.md to add your Firebase project settings.');const appMod=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js');const dbMod=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js');initializeApp=appMod.initializeApp;getDatabase=dbMod.getDatabase;ref=dbMod.ref;onValue=dbMod.onValue;runTransaction=dbMod.runTransaction;db=getDatabase(initializeApp(window.firebaseConfig));myId=sessionStorage.getItem('life-lab-id')||crypto.randomUUID();sessionStorage.setItem('life-lab-id',myId);const previous=JSON.parse(sessionStorage.getItem('life-lab-session')||'null');if(previous?.roomCode&&previous.myId===myId){roomCode=previous.roomCode;subscribe()}else welcome()}catch(e){show(`<h2>⚙️ Setup Needed</h2><p class="error">${safe(e.message)}</p><p>Open the README file and configure Firebase before playing online.</p><p><a href="offline-game.html" style="color:#ffcf57">Play offline version now</a></p>`)}render()}boot();
</script></body></html>

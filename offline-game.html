<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE LAB: Money Wars</title><style>
:root{font-family:system-ui,Arial;color:#f5f7ff;background:#0a1025}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243a72,#0a1025 65%);min-height:100vh}.wrap{max-width:1160px;margin:auto;padding:18px}h1{margin:4px 0;font-size:clamp(28px,5vw,52px);letter-spacing:2px}h1 span{color:#ffcf54}.sub{color:#a9c3ff;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.panel{background:#151f40;border:1px solid #38518b;border-radius:18px;padding:16px;box-shadow:0 12px 35px #0005}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;gap:3px;background:#283963;border:6px solid #314d84;border-radius:14px;overflow:hidden}.tile{position:relative;background:#e5eaf6;color:#172340;font-size:clamp(7px,1vw,12px);padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;min-width:0;overflow:hidden}.tile .bar{height:7px;width:calc(100% + 8px);margin:-4px -4px 1px}.tile .name{font-weight:800;line-height:1.12;overflow-wrap:anywhere}.tile .price{font-weight:700}.tile.special{background:#fff0c4}.tile.corner{background:#bfe8f4}.tokens{display:flex;flex-wrap:wrap;justify-content:center;gap:1px}.token{font-size:clamp(10px,1.6vw,19px);filter:drop-shadow(0 1px 1px #0007);animation:pop .25s ease}.center{grid-column:2/8;grid-row:2/8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#334d86,#111b39);padding:14px}.center .big{font-size:clamp(38px,8vw,95px)}.center strong{font-size:clamp(19px,4vw,45px);color:#ffcf54}.center p{max-width:350px;color:#c8d6f8}.dice{font-size:60px;min-height:80px}.rolling{animation:shake .14s infinite}button{border:0;border-radius:12px;padding:12px 16px;background:#ffca4b;color:#152044;font-weight:900;cursor:pointer;font-size:15px}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#36518e;color:#fff}button.danger{background:#ec6880;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.players{display:grid;gap:8px}.player{background:#24345e;border-radius:12px;padding:10px;border:2px solid transparent}.player.active{border-color:#ffce53}.player.out{opacity:.5}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.money{color:#78efb2;font-weight:900}.log{height:185px;overflow:auto;background:#0c1530;border-radius:10px;padding:10px;font-size:13px;color:#c9d8ff}.log div{margin-bottom:7px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal[hidden]{display:none}.dialog{width:min(450px,100%);background:#1d2c54;border:2px solid #7391d1;border-radius:20px;padding:25px;text-align:center;box-shadow:0 25px 90px #000b}.dialog h2{color:#ffd35e}.dialog p{line-height:1.5}.tag{display:inline-block;background:#345489;padding:5px 10px;border-radius:20px;font-size:12px;margin:4px}input,select{background:#0d1734;border:1px solid #6683c4;color:white;padding:12px;border-radius:9px;width:100%;margin:7px 0}.help{color:#b4c9ed;font-size:13px}.footer{color:#a3b9e4;text-align:center;font-size:12px;margin-top:18px}@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(15deg)}100%{transform:rotate(-12deg)}}@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}@media(max-width:850px){.layout{grid-template-columns:1fr}.tile{padding:2px;font-size:clamp(6px,1.5vw,11px)}.tile .bar{margin:-2px -2px 1px;width:calc(100% + 4px)}.center p{font-size:12px}.panel{padding:10px}}
</style></head><body><div class="wrap"><h1>⚔️ LIFE LAB <span>MONEY WARS</span></h1><p class="sub">Build your empire. Survive surprises. Learn money by playing.</p><div class="layout"><section class="panel"><div id="board" class="board" aria-label="28 square game board"></div></section><aside class="panel"><div class="row"><h2 style="margin:0">🎲 Turn</h2><span id="round" class="tag">Round 1</span></div><h3 id="turnName">Set up a game</h3><div id="dice" class="dice">⚀ ⚄</div><div class="actions"><button id="roll" disabled>Roll Dice</button><button id="end" class="secondary" disabled>End Turn</button></div><div id="status" class="help">Choose players to begin.</div><h3>🏆 Players</h3><div id="players" class="players"></div><h3>📣 Game Feed</h3><div id="log" class="log" aria-live="polite"></div><div class="actions"><button id="new" class="secondary">New Game</button><button id="rules" class="secondary">Rules</button></div></aside></div><p class="footer">Competition demo • Local pass-and-play for 2–4 players • Works offline • No account required</p></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><script>
const colors=['#f97373','#f97373','#f97373','#67b8ff','#67b8ff','#67b8ff','#a989ff','#a989ff','#a989ff','#ffb54f','#ffb54f','#ffb54f','#5ed4a3','#5ed4a3','#5ed4a3','#ef8cd5','#ef8cd5','#ef8cd5'];
const names=['Pixel Plaza','Creator Corner','Podcast Park','Cloud Avenue','Data District','App Arcade','Market Mile','Startup Street','Innovation Inn','Solar Square','Green Gardens','Wind Way','Finance Forum','Savings Street','Bank Boulevard','Robot Road','AI Alley','Future Factory'];
const tiles=[{type:'start',name:'🚀 Launch Pad'},...names.slice(0,3).map((name,i)=>({type:'property',name,group:0,price:100+i*20})),{type:'event',name:'🎁 Life Event'},...names.slice(3,6).map((name,i)=>({type:'property',name,group:1,price:150+i*20})),{type:'tax',name:'💸 Tax Day',amount:100},...names.slice(6,9).map((name,i)=>({type:'property',name,group:2,price:200+i*20})),{type:'payday',name:'💰 Gig Payday'},...names.slice(9,12).map((name,i)=>({type:'property',name,group:3,price:250+i*20})),{type:'timeout',name:'🚨 Go to Time-out'},...names.slice(12,15).map((name,i)=>({type:'property',name,group:4,price:300+i*20})),{type:'event',name:'🎲 Life Event'},...names.slice(15,18).map((name,i)=>({type:'property',name,group:5,price:350+i*20})),{type:'tax',name:'🏛️ City Tax',amount:150},{type:'payday',name:'💵 Side Hustle'}, {type:'rest',name:'🌴 Free Rest'}, {type:'event',name:'🎁 Bonus Event'}];
if(tiles.length!==28)throw Error('Board must have 28 squares');
const icons=['🚗','🚀','🦊','🐲'];let players=[],turn=0,round=1,phase='setup',busy=false;const $=id=>document.getElementById(id);const fmt=n=>'$'+n.toLocaleString();const sleep=ms=>new Promise(r=>setTimeout(r,ms));function show(html){$('dialog').innerHTML=html;$('modal').hidden=false}function hide(){$('modal').hidden=true}function log(s){let e=document.createElement('div');e.textContent=s;$('log').prepend(e)}function current(){return players[turn]}function render(){let board=$('board');board.innerHTML='';tiles.forEach((t,i)=>{let r,c;if(i<8){r=8;c=8-i}else if(i<14){r=8-(i-7);c=1}else if(i<22){r=1;c=i-12}else{r=i-20;c=8}let e=document.createElement('div');e.className='tile '+(t.type==='property'?'':(i===0||i===7||i===14||i===21?'corner':'special'));e.style.gridRow=r;e.style.gridColumn=c;let bar=t.type==='property'?`<div class="bar" style="background:${colors[t.group*3]}"></div>`:'';let owner=t.owner!==undefined?`<small>🏷️ ${players[t.owner]?.name||''}</small>`:'';e.innerHTML=bar+`<div class="name">${t.name}</div>`+(t.type==='property'?`<div class="price">${fmt(t.price)} ${'🏠'.repeat(t.houses||0)}</div>`:'')+owner+`<div class="tokens">${players.filter(p=>!p.out&&p.pos===i).map(p=>`<span class="token">${p.icon}</span>`).join('')}</div>`;board.append(e)});let center=document.createElement('div');center.className='center';center.innerHTML='<div class="big">💎</div><strong>MONEY WARS</strong><p>Every decision has a price. Build smart. Play bold.</p>';board.append(center);$('players').innerHTML=players.map((p,i)=>`<div class="player ${i===turn?'active':''} ${p.out?'out':''}"><div class="row"><b>${p.icon} ${p.name}${p.out?' (OUT)':''}</b><span class="money">${fmt(p.cash)}</span></div><small>Properties: ${tiles.filter(t=>t.owner===i).length} · Houses: ${tiles.filter(t=>t.owner===i).reduce((s,t)=>s+(t.houses||0),0)} ${p.skip?'· ⏳ Time-out':''}</small></div>`).join('');$('turnName').textContent=players.length?`${current().icon} ${current().name}'s turn`:'Set up a game';$('round').textContent='Round '+round;$('roll').disabled=phase!=='roll'||busy;$('end').disabled=phase!=='end'||busy}
function start(){let n=Number($('count').value);players=Array.from({length:n},(_,i)=>({name:($('p'+i)?.value||'').trim().slice(0,16)||'Player '+(i+1),icon:icons[i],cash:1500,pos:0,out:false,skip:false}));tiles.forEach(t=>{delete t.owner;delete t.houses});turn=0;round=1;phase='roll';$('log').innerHTML='';hide();log('🎮 New game started! Everyone begins with $1,500.');render()}
function setup(){phase='setup';players=[];render();show('<h2>⚔️ Create Your Money Wars Game</h2><p>Play together on one device. Pass the device after each turn.</p><label>Number of players</label><select id="count"><option value="2">2 Players</option><option value="3">3 Players</option><option value="4">4 Players</option></select><div id="names"></div><button id="begin">Start Battle 🚀</button><p class="help">No sign-in needed. Multiplayer room codes are not included in this offline edition.</p>');function names(){let n=Number($('count').value);$('names').innerHTML=Array.from({length:n},(_,i)=>`<input id="p${i}" maxlength="16" placeholder="${icons[i]} Player ${i+1} name" aria-label="Player ${i+1} name">`).join('')}$('count').onchange=names;names();$('begin').onclick=start}
function rent(t){let base=Math.round(t.price*.2),complete=tiles.filter(x=>x.type==='property'&&x.group===t.group).every(x=>x.owner===t.owner);return base*(complete?2:1)*(1+2*(t.houses||0))}function bankrupt(p){if(p.cash>=0)return false;p.out=true;p.cash=0;tiles.forEach(t=>{if(t.owner===players.indexOf(p)){delete t.owner;delete t.houses}});log('💥 '+p.name+' went bankrupt! Their properties return to the market.');return true}function transfer(from,to,amount){from.cash-=amount;if(to)to.cash+=Math.min(amount,amount+Math.min(0,from.cash));bankrupt(from)}function finishAction(){if(players.filter(p=>!p.out).length===1){phase='done';render();let w=players.find(p=>!p.out);show(`<h2>🏆 ${w.name} Wins!</h2><p>${w.icon} You built the last surviving empire!</p><p>Smart money choices and risk management make a difference.</p><button id="again">Play Again</button>`);$('again').onclick=setup;return}phase='end';render()}
function decision(t){let p=current();if(t.type==='property'){if(t.owner===undefined){if(p.cash>=t.price){phase='decision';render();show(`<h2>🏙️ ${t.name}</h2><p>Buy for <b>${fmt(t.price)}</b>? Base rent: ${fmt(rent(t))}. A full color set doubles rent!</p><div class="actions" style="justify-content:center"><button id="buy">Buy Property</button><button class="secondary" id="pass">Pass</button></div>`);$('buy').onclick=()=>{p.cash-=t.price;t.owner=turn;t.houses=0;log('🏙️ '+p.name+' bought '+t.name+' for '+fmt(t.price));hide();finishAction()};$('pass').onclick=()=>{log(p.name+' passed on '+t.name);hide();finishAction()};return}else log('💸 Not enough cash to buy '+t.name)}else if(t.owner!==turn){let fee=rent(t);transfer(p,players[t.owner],fee);log('🏠 '+p.name+' paid '+fmt(fee)+' rent to '+players[t.owner].name)}else if((t.houses||0)<2){let cost=Math.round(t.price*.5);if(p.cash>=cost){phase='decision';render();show(`<h2>🏗️ Upgrade ${t.name}?</h2><p>Build ${t.houses===1?'a hotel 🏨':'a house 🏠'} for ${fmt(cost)} and increase future rent!</p><button id="build">Build for ${fmt(cost)}</button> <button class="secondary" id="skip">Skip</button>`);$('build').onclick=()=>{p.cash-=cost;t.houses++;log('🏗️ '+p.name+' upgraded '+t.name);hide();finishAction()};$('skip').onclick=()=>{hide();finishAction()};return}}}else if(t.type==='tax'){transfer(p,null,t.amount);log('💸 '+p.name+' paid '+fmt(t.amount)+' in taxes.')}else if(t.type==='payday'){p.cash+=50;log('💰 '+p.name+' earned $50 from a side hustle.')}else if(t.type==='timeout'){p.skip=true;log('⏳ '+p.name+' must skip their next turn.')}else if(t.type==='event'){const events=[{title:'🎉 Viral Success!',desc:'Your side project takes off.',delta:250},{title:'🔧 Emergency Repair',desc:'Unexpected expenses happen.',delta:-180},{title:'📈 Smart Investment',desc:'Your diversified investment paid off.',delta:200},{title:'💻 Freelance Gig',desc:'Your skills earned extra income.',delta:150},{title:'📉 Market Dip',desc:'Your investment lost value.',delta:-120},{title:'🎓 Scholarship!',desc:'Education opens new doors.',delta:180},{title:'🚑 Medical Bill',desc:'An emergency fund would help.',delta:-150},{title:'💸 Subscription Audit',desc:'You canceled unused subscriptions.',delta:100}];let ev=events[Math.floor(Math.random()*events.length)];if(ev.delta<0)transfer(p,null,-ev.delta);else p.cash+=ev.delta;log(ev.title+' '+p.name+' '+(ev.delta>=0?'gained ':'lost ')+fmt(Math.abs(ev.delta)));phase='decision';render();show(`<h2>${ev.title}</h2><p>${ev.desc}</p><h2>${ev.delta>=0?'+':'−'}${fmt(Math.abs(ev.delta))}</h2><p class="help">💡 Money lesson: Prepare for risk, create income, and make thoughtful financial choices.</p><button id="continue">Continue</button>`);$('continue').onclick=()=>{hide();finishAction()};return}else if(t.type==='start')log('🚀 '+p.name+' landed on Launch Pad.');else log('🌴 '+p.name+' takes a free rest.');finishAction()}
async function roll(){if(phase!=='roll'||busy)return;busy=true;render();$('dice').classList.add('rolling');let a=1,b=1;for(let k=0;k<12;k++){a=1+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*6);$('dice').textContent='⚀⚁⚂⚃⚄⚅'[a-1]+' '+'⚀⚁⚂⚃⚄⚅'[b-1];await sleep(55)}$('dice').classList.remove('rolling');let p=current(),steps=a+b;log('🎲 '+p.name+' rolled '+a+' + '+b+' = '+steps);for(let i=0;i<steps;i++){p.pos=(p.pos+1)%28;if(p.pos===0){p.cash+=200;log('🚀 '+p.name+' passed Launch Pad and collected $200!')}render();await sleep(115)}busy=false;decision(tiles[p.pos])}
function end(){if(phase!=='end')return;let prev=turn;do{turn=(turn+1)%players.length;if(turn===0)round++}while(players[turn].out&&turn!==prev);if(current().skip){current().skip=false;log('⏳ '+current().name+' skips this turn.');phase='end';render();return}phase='roll';render()}
$('roll').onclick=roll;$('end').onclick=end;$('new').onclick=setup;$('rules').onclick=()=>{show('<h2>📜 How to Play</h2><p>Each player starts with $1,500. Roll two dice, move around 28 spaces, buy properties, and charge rent. Complete a color set to double rent. Upgrade your own properties with houses and hotels. Passing Launch Pad earns $200. Event cards can help or hurt. Tax costs money, Gig Payday pays $50, and Time-out skips your next turn. If your cash drops below zero, you are out. Last player standing wins!</p><button id="close">Back to Game</button>');$('close').onclick=hide};setup();
</script></body></html>
